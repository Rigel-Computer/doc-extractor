services:
   doc_extractor:
      build:
         context: .
         dockerfile: Dockerfile_extractor
      image: doc-extractor:latest
      container_name: doc_extractor
      ports:
         # Nur localhost. Ohne IP-Praefix bindet Docker an 0.0.0.0 - und unter
         # frontend/batch/ liegen hochgeladene Originale und fertige Extrakte,
         # die app.py per StaticFiles ausliefert. Das waere sonst ohne
         # Anmeldung aus dem ganzen LAN lesbar.
         - "127.0.0.1:7643:7643"
      volumes:
         - ./app.py:/app/app.py
         - ./frontend:/app/frontend
      environment:
         - MAX_UPLOAD_MB=20
      restart: unless-stopped
